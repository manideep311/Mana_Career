name: mana-career-prod

# Rotate container logs so a long-running host can't fill its disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-build: &backend-build
  context: ./backend
  target: prod

x-backend-env: &backend-env
  # Always production inside this stack: `environment:` overrides any ENV in
  # .env, so the production configuration checks can never be skipped.
  ENV: prod
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (run `just init-env`) before starting production}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mana}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting production}@db:5432/${POSTGRES_DB:-mana}
  REDIS_URL: redis://redis:6379/0
  FILE_STORE_LOCAL_DIR: /app/var/files

services:
  db:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting production}
      POSTGRES_DB: ${POSTGRES_DB:-mana}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mana}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  migrate:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    image: mana-career-api:${TAG:-local}
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    image: mana-career-api:${TAG:-local}
    build: *backend-build
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --forwarded-allow-ips=${NGINX_PROXY_IP:-172.30.0.2}
    volumes:
      - type: bind
        source: ./backend/var/files
        target: /app/var/files
        bind:
          create_host_path: false
    networks: [data, ingress]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
    image: mana-career-worker:${TAG:-local}
    build: *backend-build
    command: ["arq", "app.worker.main.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    networks: [data]
    volumes:
      - type: bind
        source: ./backend/var/files
        target: /app/var/files
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The worker writes a heartbeat to Redis every 30 s; `arq --check`
      # fails once it goes stale (a wedged or disconnected worker).
      test: ["CMD", "arq", "--check", "app.worker.main.WorkerSettings"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  frontend:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    image: mana-career-frontend:${TAG:-local}
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    networks: [ingress]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      ingress:
        ipv4_address: ${NGINX_PROXY_IP:-172.30.0.2}
    healthcheck:
      # 127.0.0.1, not "localhost": busybox wget resolves localhost to ::1
      # first, and nginx only listens on IPv4 -> false "unhealthy".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

networks:
  data:
    driver: bridge
  ingress:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}
          # Dynamic addresses come only from the upper half, so nginx's fixed
          # NGINX_PROXY_IP (lower half) is never handed to api/frontend first.
          ip_range: ${PROXY_DYNAMIC_RANGE:-172.30.0.128/25}
