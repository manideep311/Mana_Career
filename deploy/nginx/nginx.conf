worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 12m;
  # Don't advertise versions (nginx) or frameworks (Next.js, Uvicorn).
  server_tokens off;
  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Preserve an inbound X-Request-ID, else let nginx mint one.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  upstream api { server api:8000; }
  upstream web { server frontend:3000; }

  # Inherited by every location that does NOT set its own proxy_set_header.
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  # Direct public ingress in this deployment; configure an upstream proxy chain separately if one is added.
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID      $req_id;

  # ---- HTTP :80 -> redirect to HTTPS ----
  server {
    listen 80;
    server_name _;
    location = /nginx-health { default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
  }

  # ---- HTTPS :443 ----
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers for every HTTPS response. No location below sets its own
    # add_header, so all of them inherit this set (nginx replaces, not merges).
    # Browsers ignore HSTS on a certificate they don't trust, so a self-signed
    # local stack is unaffected; a real certificate gets a one-year policy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    # Next.js App Router streams inline <script> bootstrap payloads, so
    # script-src keeps 'unsafe-inline' (no per-request nonce infrastructure).
    # Everything else is same-origin only: the API, SSE streams, fonts and
    # images are all served through this host; nothing loads from elsewhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    location = /nginx-health { default_type text/plain; return 200 "ok\n"; }

    # Container / uptime probes -> backend health (also mounted at root by the app).
    location ~ ^/health(/ready)?$ {
      proxy_pass http://api;
    }

    # API + SSE. proxy_buffering off + long read timeout are required for the
    # EventSource streams (/api/v1/jobs/*/events, /roadmaps/*/events, agent runs).
    location /api/ {
      proxy_pass http://api;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # Everything else -> Next.js standalone server.
    location / {
      proxy_pass http://web;
    }
  }
}
