[project]
name = "mana-career-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.143.5",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.32.0",
  "alembic>=1.20.0",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.0",
  "structlog>=24.4",
  "arq>=0.26",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.15.1",
  "python-multipart>=0.0.12",
  "pgvector>=0.5.1",
  "httpx>=0.27",
  "pypdf>=6.21.1",
  "filetype>=1.2.0",
  "anthropic>=1.15.0",
  "sse-starlette>=3.5.0",
  "langgraph==1.2.16",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary]>=3.3.6",
  "markdown-it-py>=3.0.0",
  "python-docx>=1.1.2",
  "xhtml2pdf>=0.2.26",
  "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.17.1",
  "mypy>=2.4.0",
  "import-linter>=2.15",
  "asgi-lifespan>=2.1",
  "pip-audit>=2.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test fixtures use dummy secrets

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "xhtml2pdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
