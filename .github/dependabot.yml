# Weekly update PRs. Minor/patch bumps are grouped per ecosystem; majors come
# as individual PRs so each gets its own CI run and review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # arq (the job queue) requires redis<6, so newer redis can't be resolved.
      # Remove this once an arq release allows redis 6+.
      - dependency-name: redis
        versions: [">=6"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
