name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mana
          POSTGRES_PASSWORD: mana
          POSTGRES_DB: mana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mana" --health-interval 3s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
      DATABASE_URL_TEST: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
      # Phase 13 floor: raised from 55. Total is ~88%; the closeout sets the highest safe value.
      PYTEST_ADDOPTS: "--cov-fail-under=80"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run pip-audit
      - run: PGPASSWORD=mana psql -h localhost -U mana -d mana -c 'CREATE DATABASE mana_test;' || true
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run mypy app
      - run: uv run pytest

  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mana
          POSTGRES_PASSWORD: mana
          POSTGRES_DB: mana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mana" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
      DATABASE_URL_TEST: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: PGPASSWORD=mana psql -h localhost -U mana -d mana -c 'CREATE DATABASE mana_test;' || true
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
      - run: uv run python -m eval.run retrieval --write-db
        env:
          DATABASE_URL: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
          EMBEDDINGS_PROVIDER: fake
          LLM_PROVIDER: fake
          JWT_SECRET: ci-not-secret
          REDIS_URL: redis://localhost:6379/0
      - run: uv run python -m eval.run generation --write-db --provider fake
        env:
          DATABASE_URL: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
          EMBEDDINGS_PROVIDER: fake
          LLM_PROVIDER: fake
          JWT_SECRET: ci-not-secret
          REDIS_URL: redis://localhost:6379/0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test run

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Seed a dev .env for the smoke
        run: cp .env.example .env

      - name: Generate a throwaway self-signed cert
        run: |
          mkdir -p deploy/nginx/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout deploy/nginx/certs/privkey.pem \
            -out deploy/nginx/certs/fullchain.pem \
            -subj "/CN=localhost"

      - name: Build production images
        run: docker compose -f compose.prod.yml build

      - name: Trivy scan (api)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mana-career-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan (worker)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mana-career-worker:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mana-career-frontend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Bring the stack up
        run: docker compose -f compose.prod.yml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost/health/ready >/dev/null 2>&1; then
              echo "ready after ${i} tries"; exit 0
            fi
            sleep 3
          done
          echo "stack did not become ready in 180s"; exit 1

      - name: Smoke
        run: ./scripts/smoke-prod.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.prod.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f compose.prod.yml down -v
