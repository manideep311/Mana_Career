name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: jobs only read the repository. No job uses repository
# secrets; every credential below is an inline, CI-only placeholder.
permissions:
  contents: read

# One run per branch; a newer push cancels an in-flight run except on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Third-party actions are pinned to full commit SHAs (tags can be moved).
# Dependabot (.github/dependabot.yml) proposes updates to these pins.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mana
          POSTGRES_PASSWORD: mana
          POSTGRES_DB: mana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mana" --health-interval 3s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
      # Real SMTP server for the email round-trip test (tests/integration).
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["1025:1025", "8025:8025"]
    env:
      MAILPIT_URL: http://localhost:8025
      MAILPIT_SMTP_PORT: "1025"
      DATABASE_URL: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
      DATABASE_URL_TEST: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret-for-the-backend-test-suite
      # Total coverage is ~89%; 80 is the enforced floor.
      PYTEST_ADDOPTS: "--cov-fail-under=80"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run pip-audit
      - run: PGPASSWORD=mana psql -h localhost -U mana -d mana -c 'CREATE DATABASE mana_test;' || true
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run mypy app
      - run: uv run pytest

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mana
          POSTGRES_PASSWORD: mana
          POSTGRES_DB: mana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mana" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
      DATABASE_URL_TEST: postgresql+asyncpg://mana:mana@localhost:5432/mana_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret-for-the-eval-harness-jobs
      EMBEDDINGS_PROVIDER: fake
      LLM_PROVIDER: fake
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: PGPASSWORD=mana psql -h localhost -U mana -d mana -c 'CREATE DATABASE mana_test;' || true
      - run: uv run alembic upgrade head
      - run: uv run python -m eval.run retrieval --write-db
      - run: uv run python -m eval.run generation --write-db --provider fake

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test run
      - run: pnpm build

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Seed a dev .env for the smoke
        run: cp .env.example .env

      - name: Seed CI-only production secrets
        run: |
          sed -i 's/^ENV=.*/ENV=prod/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-only-jwt-secret-that-is-never-used-outside-ci/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-postgres-password/' .env
          # The disposable stack has no provider keys: run it as a labelled demo.
          sed -i 's/^DEMO_MODE=.*/DEMO_MODE=true/' .env
          sed -i 's/^SEARCH_PROVIDER=.*/SEARCH_PROVIDER=none/' .env

      - name: Validate production Compose configuration
        run: docker compose -f compose.prod.yml config --quiet

      - name: Prepare persistent résumé storage
        run: bash ./scripts/prepare-prod.sh

      - name: Generate a throwaway self-signed cert
        run: |
          mkdir -p deploy/nginx/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout deploy/nginx/certs/privkey.pem \
            -out deploy/nginx/certs/fullchain.pem \
            -subj "/CN=localhost"

      - name: Build production images
        run: docker compose -f compose.prod.yml build

      - name: Trivy scan (api)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mana-career-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan (worker)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mana-career-worker:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan (frontend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mana-career-frontend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Bring the stack up
        run: docker compose -f compose.prod.yml up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost/health/ready >/dev/null 2>&1; then
              echo "ready after ${i} tries"; exit 0
            fi
            sleep 3
          done
          echo "stack did not become ready in 180s"; exit 1

      - name: Every service reports healthy
        run: |
          for i in $(seq 1 40); do
            unhealthy=$(docker compose -f compose.prod.yml ps --format '{{.Service}} {{.Health}}' \
              | awk '$2 != "" && $2 != "healthy" {print $1}')
            [ -z "$unhealthy" ] && { docker compose -f compose.prod.yml ps; exit 0; }
            sleep 3
          done
          docker compose -f compose.prod.yml ps
          echo "not healthy: $unhealthy"; exit 1

      - name: Smoke
        run: SMOKE_UPLOAD_PERSISTENCE=1 ./scripts/smoke-prod.sh

      # ---- End-to-end: a real browser through the production stack ----
      - name: Load the demo catalogue (jobs, skills, learning resources)
        run: docker compose -f compose.prod.yml run --rm migrate python -m app.seed all

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install end-to-end tooling
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        env:
          E2E_BASE_URL: https://localhost
        run: pnpm e2e

      - name: Keep the end-to-end report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Backup round-trip
        run: |
          BACKUP_DIR="$RUNNER_TEMP/backups" ./scripts/backup.sh
          ls -l "$RUNNER_TEMP/backups"
          test -s "$(ls "$RUNNER_TEMP"/backups/db-*.dump)"
          tar -tzf "$(ls "$RUNNER_TEMP"/backups/files-*.tgz)" | grep -q '\.pdf$'

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.prod.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f compose.prod.yml down -v
